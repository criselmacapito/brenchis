<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>¿Me perdonas, Brenchi?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d9d9d9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141414; --fg: #eeeeee; --muted: #9a9a9a; --line: #333333; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #141414; --fg: #eeeeee; --muted: #9a9a9a; --line: #333333; color-scheme: dark; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 48px;
  }
  main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; text-align: center; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-size: 16px;
    padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #mensaje { min-height: 24px; color: var(--muted); margin: 0; }
  pre { font-family: var(--mono); font-size: 15px; line-height: 1.3; margin: 0; display: inline-block; text-align: left; }
  #final { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  #final p { font-size: 20px; margin: 0; }
  #foto { max-width: 100%; border-radius: 8px; }
</style>

<main>
  <h1>¿Me perdonas?</h1>

  <div id="pregunta" class="opciones">
    <button data-r="si">si</button>
    <button data-r="no">no</button>
    <button data-r="tal vez">tal vez</button>
    <button data-r="no se">no se</button>
  </div>
  <p id="mensaje"></p>

  <div id="final" hidden>
    <p>¡Gracias mi BRENCHI!  Te ganaste una pizza JAJASJAJDJ</p>
<pre>   ___________
   \ o  o  o /
    \  o  o /
     \ o   /
      \  o/
       \ /</pre>
<pre>me encanta tu cornea</pre>
    <img id="foto" src="guerrera.jpg" alt="Guerrera" onerror="this.hidden=true">
  </div>
</main>

<script>
  const mensajes = {
    "no": "que chch dices que no jaja, responde bn",
    "tal vez": "cuidao",
    "no se": "como q no sabes"
  };

  document.querySelectorAll("[data-r]").forEach(boton => {
    boton.onclick = () => {
      const r = boton.dataset.r;
      if (r === "si") {
        document.getElementById("pregunta").hidden = true;
        document.getElementById("mensaje").hidden = true;
        document.getElementById("final").hidden = false;
      } else {
        document.getElementById("mensaje").textContent = mensajes[r];
      }
    };
  });
</script>

</body></html>
